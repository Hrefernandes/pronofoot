name: CI

# Vérifie à chaque push/PR ce que le dossier de certification exige :
# analyse statique propre, tests exécutés, build web fonctionnel.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'

      - run: flutter pub get

      - name: Analyse statique (flutter analyze)
        run: flutter analyze

      - name: Vérifie le formatage
        run: dart format --output=none --set-exit-if-changed .

      - name: Tests unitaires et de widgets
        run: flutter test --coverage

      - name: Build web (validation de compilation)
        run: flutter build web

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
